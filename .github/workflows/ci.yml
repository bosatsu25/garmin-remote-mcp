name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # weekly: catch newly published CVEs in pinned deps

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.13" }
      - run: pip install --require-hashes -r requirements-dev.lock
      - name: Ruff (incl. flake8-bandit security rules)
        run: ruff check src tests tools

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.13" }
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: pip install --no-deps -e .
      - name: Unit, integration, system and acceptance tests with branch coverage gate
        run: pytest -q --cov --cov-report=term-missing

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.13" }
      - run: pip install --require-hashes -r requirements-dev.lock
      - name: Known vulnerabilities in runtime dependencies
        run: pip-audit -r requirements.lock --require-hashes --disable-pip --strict
      - name: Lock files match pyproject.toml
        run: |
          pip install uv==0.11.32
          uv pip compile pyproject.toml --generate-hashes --python-version 3.13 \
            --python-platform x86_64-manylinux_2_28 -o /tmp/req.lock -q
          diff <(grep -E '^[a-z]' requirements.lock) <(grep -E '^[a-z]' /tmp/req.lock)

  mutation:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.13" }
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: pip install --no-deps -e .
      - name: Planted security bugs must all be caught
        run: python tools/mutation_check.py

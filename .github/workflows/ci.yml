name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # weekly: catch newly published CVEs in pinned deps

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.13" }
      - run: pip install --require-hashes -r requirements-dev.lock
      - name: Ruff (incl. flake8-bandit security rules)
        run: ruff check src tests tools

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.13" }
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: pip install --no-deps -e .
      - name: Unit, integration, system and acceptance tests with branch coverage gate
        run: pytest -q --cov --cov-report=term-missing

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.13" }
      - run: pip install --require-hashes -r requirements-dev.lock
      - name: Known vulnerabilities in runtime dependencies
        run: pip-audit -r requirements.lock --require-hashes --disable-pip --strict
      - name: Lock files match pyproject.toml
        run: |
          pip install uv==0.11.32
          uv pip compile pyproject.toml --generate-hashes --python-version 3.13 \
            --python-platform x86_64-manylinux_2_28 -o /tmp/req.lock -q
          diff <(grep -E '^[a-z]' requirements.lock) <(grep -E '^[a-z]' /tmp/req.lock)

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Build image (hash-locked dependencies, digest-pinned base)
        run: docker build -t garmin-mcp:ci .
      - name: Smoke test the container as it should be run (read-only, no capabilities)
        run: |
          set -euo pipefail
          HASH=$(docker run --rm garmin-mcp:ci python -c \
            "from garmin_mcp.security import hash_owner_password as h; print(h('ci-smoke-test-passphrase'))")
          docker run -d --name gm -p 127.0.0.1:8000:8000 \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /data:uid=10001,gid=10001,mode=700 \
            -e PUBLIC_URL=http://localhost:8000 -e OWNER_PASSWORD_HASH="$HASH" garmin-mcp:ci
          for _ in $(seq 1 30); do curl -fsS localhost:8000/healthz >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS localhost:8000/healthz
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          test "$(docker exec gm id -u)" = "10001"                       # not root
          if docker exec gm python -m pip --version; then exit 1; fi     # no package manager
          test "$(docker exec gm stat -c %a /data)" = "700"
          test "$(code -X POST localhost:8000/mcp -H 'content-type: application/json' -d '{}')" = "401"
          test "$(code -X POST localhost:8000/mcp/ -H 'Host: evil.example')" = "404"
          test "$(code localhost:8000/oauth/connections)" = "200"
          test "$(code -X POST localhost:8000/register -H 'content-type: application/json' \
            -d '{"redirect_uris":["http://localhost:1/cb"],"token_endpoint_auth_method":"none"}')" = "201"
          test "$(docker exec gm stat -c %a /data/oauth_state.json)" = "600"
      - if: failure()
        run: docker logs gm || true

  mutation:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.13" }
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: pip install --no-deps -e .
      - name: Planted security bugs must all be caught
        run: python tools/mutation_check.py

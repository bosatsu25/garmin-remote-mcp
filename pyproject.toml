[project]
name = "garmin-remote-mcp"
version = "0.1.0"
description = "Remote MCP server for Garmin Connect (single owner, OAuth 2.1, Streamable HTTP)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "garminconnect[workout]>=0.3.20,<0.4",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
garmin-mcp = "garmin_mcp.server:main"
garmin-mcp-login = "garmin_mcp.login_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

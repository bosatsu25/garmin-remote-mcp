[project]
name = "garmin-remote-mcp"
version = "0.1.0"
description = "Remote MCP server for Garmin Connect (single owner, OAuth 2.1, Streamable HTTP)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "garminconnect[workout]>=0.3.20,<0.4",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "ruff>=0.6",
    "pip-audit>=2.7",
]

[project.scripts]
garmin-mcp = "garmin_mcp.server:main"
garmin-mcp-login = "garmin_mcp.login_cli:main"
garmin-mcp-hash-password = "garmin_mcp.hash_password:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider --strict-markers"
filterwarnings = ["error::DeprecationWarning:garmin_mcp.*"]

[tool.coverage.run]
branch = true
source = ["garmin_mcp"]
# System tests start the server as a subprocess; measure it too.
patch = ["subprocess"]
parallel = true
sigterm = true

[tool.coverage.report]
fail_under = 98
show_missing = true
skip_covered = true
exclude_also = ['if __name__ == "__main__":']

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# S = flake8-bandit (security), B = bugbear, BLE = blind except, TRY = exception hygiene
select = ["E", "F", "W", "I", "B", "S", "UP", "SIM", "RUF", "BLE", "TRY", "PIE", "PT", "ASYNC"]
ignore = ["TRY003", "RUF001", "RUF002", "RUF003"]  # long messages / Japanese text are fine

[tool.ruff.lint.per-file-ignores]
"tools/**" = ["E501", "E741", "S603", "S101", "E401", "I001"]
"tests/**" = ["S101", "S105", "S106", "S108", "S311", "TRY", "B017", "PT011", "E501"]
